<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Built by Compo</title>
<meta name="description" content="Built by Compo. Website under construction.">
<meta name="theme-color" content="#f42902">
<link rel="canonical" href="https://builtbycompo.co.uk/">
<link rel="preload" href="fonts/cooper-standin.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/avant-garde-standin.woff" as="font" type="font/woff" crossorigin>
<style>
/* Temporary holding page (6 Nov 2026). Colours and fonts are placeholders. */
@font-face { font-family: "Avant Garde Stand-in"; src: url("fonts/avant-garde-standin.woff") format("woff"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Cooper Stand-in"; src: url("fonts/cooper-standin.woff") format("woff"); font-weight: 900; font-display: swap; }
:root {
  --main: #f42902;        /* Red Orange */
  --main-deep: #c81f00;
  --main-light: #ff4a14;
  --secondary: #fdfdff;   /* Snowy White */
  --accent: #c8fd02;      /* Yellow Punk */
  --f-gothic: "Avant Garde Stand-in", "Century Gothic", "Segoe UI", sans-serif;
  --f-cooper: "Cooper Stand-in", "Cooper Black", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; color: var(--secondary); background: var(--main); -webkit-font-smoothing: antialiased; }

/* Moving red gradient */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(120deg, var(--main-deep) 0%, var(--main) 30%, var(--main-light) 50%, var(--main) 70%, var(--main-deep) 100%);
  background-size: 300% 300%;
  animation: flow 14s ease-in-out infinite alternate;
}
/* Yellow sweep on top, faded out in the middle so the yellow text always sits on red */
.bg::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 0%, transparent 35%, rgba(200, 253, 2, .5) 50%, transparent 65%, transparent 100%);
  background-size: 300% 300%;
  animation: sweep 11s ease-in-out infinite alternate;
  -webkit-mask-image: radial-gradient(ellipse 58% 42% at 50% 48%, transparent 45%, #000 100%);
          mask-image: radial-gradient(ellipse 58% 42% at 50% 48%, transparent 45%, #000 100%);
  opacity: .8;
}
@keyframes flow { 0% { background-position: 0% 30%; } 100% { background-position: 100% 70%; } }
@keyframes sweep { 0% { background-position: 100% 0%; } 100% { background-position: 0% 100%; } }

main {
  position: relative; z-index: 1; height: 100%;
  display: grid; place-items: center; text-align: center;
  padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right));
}
h1 { margin: 0; display: grid; justify-items: center; line-height: .82; font-weight: normal; }
.built { font-family: var(--f-gothic); font-weight: 700; font-size: clamp(2.2rem, .6rem + 8vw, 5.2rem); letter-spacing: -.035em; }
.compo { font-family: var(--f-cooper); font-weight: 900; font-size: clamp(5.4rem, 1rem + 22vw, 13.5rem); letter-spacing: -.03em; margin-top: -.02em; padding-bottom: .2em; }
.status { margin: 0; font-family: var(--f-gothic); font-weight: 700; font-size: clamp(1.05rem, .9rem + .7vw, 1.6rem); letter-spacing: -.02em; color: var(--accent); }

.email {
  position: fixed; z-index: 1;
  right: max(24px, calc(env(safe-area-inset-right) + 24px));
  bottom: max(22px, calc(env(safe-area-inset-bottom) + 22px));
  font-family: var(--f-gothic); font-weight: 700; font-size: clamp(.85rem, .78rem + .25vw, 1rem); letter-spacing: -.01em;
  color: var(--secondary); text-decoration: none; padding: 10px 0; transition: color .2s ease;
}
.email:hover { color: var(--accent); }
.email:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { .bg, .bg::after { animation: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <div>
    <h1><span class="built">Built by</span><span class="compo">Compo</span></h1>
    <p class="status">Website under construction</p>
  </div>
</main>
<a class="email" href="mailto:luke@builtbycompo.co.uk">luke@builtbycompo.co.uk</a>
</body>
</html>
